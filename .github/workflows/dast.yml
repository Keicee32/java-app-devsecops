
name: 50 DAST Scan Docker Image

on:
  workflow_dispatch:
    inputs:
      image-tag:
        type: string
        description: "The name of the Docker image to scan"
        required: true

  workflow_call:
    inputs:
      image-tag:
        type: string
        description: "The name of the Docker image to scan"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ inputs.image-tag }}

jobs:
  dast-scan:
    name: DAST Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Application Container
        run: |
          docker rm -f demoApp 2>/dev/null || true
          docker run -d \
            --name demoApp \
            -p 8080:8080 \
            "$IMAGE_TAG"

      - name: Wait for Application
        run: |
          for i in {1..60}; do
            if curl -fsS \
              "http://127.0.0.1:8080/echo?msg=Hello%20World!" \
              > /dev/null; then
              echo "Application is ready"
              exit 0
            fi
            sleep 5
          done

          echo "Application failed to become ready"
          docker logs demoApp
          exit 1

      - name: Determine ZAP Target
        id: network
        run: |
          GATEWAY=$(docker network inspect bridge \
            --format '{{(index .IPAM.Config 0).Gateway}}')
          echo "url=http://${GATEWAY}:8080" >> "$GITHUB_OUTPUT"

      - name: Run OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ steps.network.outputs.url }}
          cmd_options: '-a -j -l WARN'
          allow_issue_writing: false
          fail_action: false

      - name: Upload DAST Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DAST-Report
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn

      - name: Stop Application Container
        if: always()
        run: |
          docker rm -f demoApp 2>/dev/null || true

