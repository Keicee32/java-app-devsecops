name: 51 Scan Docker Image
on:
  workflow_dispatch:
    inputs:
      image-tag:
        type: string
        description: 'The name of the docker image to scan'
        required: true

  workflow_call:
    inputs:
      image-tag:
        type: string
        description: 'The name of the docker image to scan'
        required: true
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ inputs.image-tag || github.event.inputs.image-tag }}

jobs:
  container-image-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v2.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Image to Scan
        run: docker pull ${{ env.IMAGE_TAG }}

      # Install Trivy through the official Apt repository system
      - name: Install Official Trivy via APT Repository
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://github.io | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://github.io $(lsb-release -sc) main" | sudo tee /etc/apt/sources.list.dev/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # Download the template and execute the binary directly from system paths
      - name: Run Trivy Binary Scan
        run: |
          wget -q https://githubusercontent.com
          trivy image \
            --format template \
            --template "@sarif.tpl" \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            ${{ env.IMAGE_TAG }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

