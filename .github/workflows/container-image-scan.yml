name: 51 Scan Docker Image
on:
  workflow_dispatch:
    inputs:
      image-tag:
        type: string
        description: 'The name of the docker image to scan'
        required: true

  workflow_call:
    inputs:
      image-tag:
        type: string
        description: 'The name of the docker image to scan'
        required: true
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ inputs.image-tag || github.event.inputs.image-tag }}



jobs:
  container-image-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v2.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Image to Scan
        run: docker pull ${{ env.IMAGE_TAG }}

      - name: Install Official Trivy Binary via Script
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.50.0
      # Download and install the specific native Linux binary release safely
      #- name: Install Official Trivy Binary
      #  run: |
      #    wget https://github.com
      #    sudo dpkg -i trivy_0.50.0_Linux-64bit.deb

      # Download the template and execute the binary locally on the host machine
      - name: Run Trivy Binary Scan
        run: |
          wget -q https://githubusercontent.com
          trivy image \
            --format template \
            --template "@sarif.tpl" \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            ${{ env.IMAGE_TAG }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

