
name: 10 Build pipeline

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Update Maven dependency versions before building
#      - name: Update Maven Packages
#        run: |
#          echo "Updating parent POM..."
#          mvn -B versions:update-parent \
#            -DgenerateBackupPoms=false

#          echo "Updating dependency version properties..."
#          mvn -B versions:update-properties \
#            -DgenerateBackupPoms=false

#          echo "Updating Maven dependencies and build plugins..."
#          mvn -B versions:use-latest-releases \
#            -DprocessPlugins=true \
#            -DprocessPluginDependencies=true \
#            -DgenerateBackupPoms=false

      - name: Check Maven Dependency Updates
        run: mvn -B versions:display-dependency-updates

      # Compile, package, and run tests
      - name: Build and Test with Maven
        run: mvn -B clean verify

      # Prepare build artifacts and test reports
      - name: Prepare Artifacts
        run: |
          mkdir -p candidate-binary test-results
          cp target/*.jar candidate-binary/
          find target -type f \
            -path '*/surefire-reports/TEST-*.xml' \
            -exec cp {} test-results/ \;

      - name: Upload Application Binary
        uses: actions/upload-artifact@v7
        with:
          name: Application-Binary
          path: candidate-binary/

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: Test-Results
          path: test-results/

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.0.0
        if: always()
        with:
          junit_files: "test-results/**/*.xml"

