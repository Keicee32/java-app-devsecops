
name: 30 License Compliance

on:
  workflow_dispatch:
  workflow_call:

jobs:
  license-finder:
    name: License Compliance Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configure Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3: Pin Maven version
      - name: Set up Maven 3.9.11
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.11

      # Step 4: Configure Maven repository
      - name: Configure Maven Local Repository
        shell: bash
        run: |
          mkdir -p "$HOME/.m2/repository"

          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <localRepository>${HOME}/.m2/repository</localRepository>
          </settings>
          EOF

          echo "Maven settings:"
          cat "$HOME/.m2/settings.xml"

      # Step 5: Use installed Maven instead of wrapper
      - name: Use System Maven
        shell: bash
        run: |
          if [ -f mvnw ]; then
            mv mvnw mvnw.disabled
          fi

          echo "Maven executable:"
          command -v mvn

          echo "Maven version:"
          mvn -version

      # Step 6: Download project dependencies
      - name: Prepare Maven Dependencies
        shell: bash
        run: |
          set -euo pipefail

          mvn -B -ntp dependency:go-offline

          mvn -B -ntp dependency:get \
            -Dartifact=ch.qos.logback:logback-classic:1.2.3:pom \
            -Dtransitive=false

      # Step 7: Diagnose Maven repository resolution
      - name: Diagnose Maven Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Maven version ==="
          mvn -version

          echo "=== Maven repository without quiet mode ==="
          mvn -B help:evaluate \
            -Dexpression=settings.localRepository \
            -DforceStdout

          echo "=== Maven repository with quiet mode ==="
          mvn -q help:evaluate \
            -Dexpression=settings.localRepository \
            -DforceStdout

          echo
          echo "=== Maven settings location ==="
          ls -l "$HOME/.m2/settings.xml"

      # Step 8: Validate Maven repository
      - name: Validate Maven Repository
        shell: bash
        run: |
          set -euo pipefail

          REPO=$(mvn -q help:evaluate \
            -Dexpression=settings.localRepository \
            -DforceStdout)

          printf 'Maven repository: [%s]\n' "$REPO"

          case "$REPO" in
            /*)
              echo "Maven returned an absolute repository path"
              ;;
            *)
              echo "::error::Invalid Maven repository path"

              echo "=== Effective Maven settings ==="
              mvn -B help:effective-settings

              exit 1
              ;;
          esac

          POM="$REPO/ch/qos/logback/logback-classic/1.2.3/logback-classic-1.2.3.pom"

          if [ ! -f "$POM" ]; then
            echo "::error::Logback POM not found: $POM"
            exit 1
          fi

          echo "Logback POM verified successfully"

      # Step 9: Run License Finder
      - name: Run License Finder
        uses: jmservera/license-finder-action@main
        with:
          permitted-licenses: MIT,Apache-2.0,BSD,EPL1
          approved-dependencies: >-
            hamcrest,hamcrest-core,hamcrest-library,
            junit-jupiter,junit-jupiter-api,
            junit-jupiter-engine,javax.annotation-api
          report-name: license_finder_report.xml

      # Step 10: Publish license compliance results
      - name: Publish License Compliance Results
        if: ${{ !cancelled() && hashFiles('license_finder_report.xml') != '' }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: license_finder_report.xml
          check_name: License Compliance Check
          check_run: 'false'
          comment_mode: off
          job_summary: 'true'

      # Step 11: Upload report
      - name: Upload License Compliance Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: license-finder-report
          path: license_finder_report.xml
          if-no-files-found: warn

